        "bankobs",
        "golden-signals"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "graphTooltip": 1,
      "editable": true,
      "fiscalYearStartMonth": 0,
      "templating": {
        "list": [
          {
            "name": "ds_prom",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "multi": false,
            "includeAll": false,
            "hide": 0,
            "current": {}
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${ds_prom}"
            },
            "definition": "label_values(up{job=~\"bankobs/.*\"}, namespace)",
            "query": {
              "qryType": 1,
              "query": "label_values(up{job=~\"bankobs/.*\"}, namespace)",
              "refId": "PrometheusVariableQueryEditor-VariableQuery"
            },
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "multi": false,
            "includeAll": false,
            "hide": 0,
            "current": {
              "selected": true,
              "text": "bankobs",
              "value": "bankobs"
            },
            "options": [
              {
                "selected": true,
                "text": "bankobs",
                "value": "bankobs"
              }
            ]
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "links": [],
      "panels": [
        {
          "id": 2,
          "type": "stat",
          "title": "Request rate",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
