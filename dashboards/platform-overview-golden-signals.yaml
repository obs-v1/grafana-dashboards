            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              },
              "expr": "sum(rate(http_request_duration_highr_seconds_count{namespace=~\"$namespace\",job=~\"bankobs/.*\"}[$__rate_interval])) or vector(0)",
              "editorMode": "code",
              "instant": false,
              "range": true,
              "exemplar": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {},
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
