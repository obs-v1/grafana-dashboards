      "title": "Platform Overview \u2014 Golden Signals",
      "description": "Fleet golden signals for BankObs. Request rate, 5xx share, and latency use http_request_duration_highr_seconds (labels include app, namespace, job, status). Tier is java/go/python via jvm_info, go_info, and python_info joined on app. Up/down counts scrape target up for job bankobs/*. Saturation is process_cpu_seconds_total and process_resident_memory_bytes from the bankobs scrapes. Service rows open dashboard uid bankobs-service-red with var-service set.",
