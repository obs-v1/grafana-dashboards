              "sort": "desc"
            }
          }
        },
        {
          "id": 20,
          "type": "row",
          "title": "Duration",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "panels": []
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "Latency",
          "description": "histogram_quantile of http_server_request_duration_seconds_bucket",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 8,
            "w": 14,
            "x": 0,
            "y": 22
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_request_duration_seconds_bucket{namespace=~\"$namespace\",job=~\"bankobs/.*\",service=~\"$service\"}[$__rate_interval])))",
              "editorMode": "code",
              "legendFormat": "p50",
              "instant": false,
              "range": true,
              "exemplar": false,
              "format": "time_series"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{namespace=~\"$namespace\",job=~\"bankobs/.*\",service=~\"$service\"}[$__rate_interval])))",
              "editorMode": "code",
              "legendFormat": "p95",
