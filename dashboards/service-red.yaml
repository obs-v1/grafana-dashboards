                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          }
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "4xx vs 5xx",
          "description": "No exception counter is exported on the server histogram; status class is the error split",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prom}"
          },
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prom}"
              },
              "expr": "sum by (status) (rate(http_server_requests_total{namespace=~\"$namespace\",job=~\"bankobs/.*\",service=~\"$service\",status=~\"4xx|5xx\"}[$__rate_interval]))",
              "editorMode": "code",
              "legendFormat": "{{status}}",
              "instant": false,
              "range": true,
              "exemplar": false,
              "format": "time_series"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 12,
