              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.3
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "links": [
                {
                  "title": "Trace / Latency",
                  "url": "/d/bankobs-trace-latency/trace-latency?${__url_time_range}&var-ds_prom=${ds_prom}&var-ds_jaeger=${ds_jaeger}&var-namespace=${namespace}&var-service=${service}",
                  "targetBlank": false,
                  "keepTime": true,
                  "type": "link"
                },
                {
                  "title": "Jaeger",
                  "url": "/explore?schemaVersion=1&orgId=1&panes=%7B%22j%22%3A%7B%22datasource%22%3A%22${ds_jaeger}%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22datasource%22%3A%7B%22type%22%3A%22jaeger%22%2C%22uid%22%3A%22${ds_jaeger}%22}%2C%22queryType%22%3A%22traceql%22%2C%22query%22%3A%22%7B%20resource.service.name%20%3D~%20%5C%22${service}%5C%22%20}%22}%5D%2C%22range%22%3A%7B%22from%22%3A%22now-1h%22%2C%22to%22%3A%22now%22}}}",
                  "targetBlank": false,
                  "keepTime": true,
                  "type": "link"
                }
